<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | The Skull Tattoo Art</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* CSS EMBUTIDO PARA SER MAIS RÁPIDO NO CELULAR */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            margin-bottom: 15px;
            object-fit: cover;
            filter: drop-shadow(0 0 10px rgba(212,175,55,0.3));
        }
        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #d4af37;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        p { font-size: 0.9rem; color: #888; margin-bottom: 30px; text-align: center; }

        .links-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }

        .link-card {
            background: #111;
            border: 1px solid #222;
            color: #fff;
            text-decoration: none;
            padding: 18px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .link-card:hover {
            border-color: #d4af37;
            background: #1a1a1a;
            transform: scale(1.02);
        }
        .highlight {
            background: linear-gradient(145deg, #25d366, #128c7e);
            border: none;
        }
        footer { margin-top: auto; padding-top: 40px; font-size: 0.8rem; color: #444; }
    </style>
</head>
<body>

    <img src="./logo-original.png" alt="The Skull Tattoo" class="profile-img">

    <h1>The Skull Tattoo Art</h1>
    <p>Arte na pele desde 2017 • Caraguatatuba/SP</p>

    <div class="links-container">
        <a href="https://wa.me/5512999999999?text=Olá Fábio, vim pelo Instagram e quero um orçamento" class="link-card highlight">
            🔥 ORÇAMENTO VIA WHATSAPP
        </a>

        <a href="./index.html" class="link-card">
            🌐 VER MEU PORTFÓLIO COMPLETO
        </a>

        <a href="http://maps.google.com/?q=Alameda Francisco Alvaro Bueno de Paiva 487 Caraguatatuba" target="_blank" class="link-card">
            📍 COMO CHEGAR NO ESTÚDIO
        </a>

        <a href="https://instagram.com/the.skulltattooart" target="_blank" class="link-card">
            📸 ME SIGA NO INSTAGRAM
        </a>
    </div>

    <footer>
        © 2026 Fábio Oliveira • The Skull Tattoo
    </footer>

</body>
</html>
